<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SAP 签名</title>
  <style>
    :root {
      color-scheme: light dark;
      --accent: #007aff;
      --text: #15151a;
      --secondary: rgba(21, 21, 26, .56);
      --card: rgba(255, 255, 255, .94);
      --stroke: rgba(60, 60, 67, .16);
      --shadow: rgba(0, 0, 0, .14);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      color: var(--text);
      background: #f2f2f7;
    }

    main {
      position: relative;
      z-index: 1;
      width: min(100%, 360px);
      padding: 42px 30px 34px;
      text-align: center;
      border: 1px solid var(--stroke);
      border-radius: 30px;
      background: var(--card);
      box-shadow: 0 24px 70px var(--shadow), inset 0 1px 0 rgba(255, 255, 255, .7);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      backdrop-filter: blur(24px) saturate(150%);
    }

    .mark {
      position: relative;
      width: 88px;
      height: 88px;
      margin: 0 auto 26px;
      display: grid;
      place-items: center;
    }

    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid rgba(0, 122, 255, .16);
      border-top-color: var(--accent);
      animation: spin 1.15s linear infinite;
    }

    .icon {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      color: white;
      background: var(--accent);
      box-shadow: 0 12px 28px rgba(0, 122, 255, .24);
    }

    .icon svg { width: 32px; height: 32px; }

    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: 0;
    }

    p {
      margin: 10px auto 0;
      max-width: 240px;
      color: var(--secondary);
      font-size: 14px;
      line-height: 1.5;
    }

    .progress {
      height: 4px;
      margin-top: 28px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(0, 122, 255, .12);
    }

    .progress::after {
      content: "";
      display: block;
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      animation: loading 1.45s ease-in-out infinite;
    }

    body.failed .ring,
    body.failed .progress { display: none; }
    body.failed .icon {
      background: #ff3b30;
      box-shadow: 0 12px 28px rgba(255, 59, 48, .22);
    }
    body.failed #detail {
      max-width: 290px;
      color: #d33131;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes loading {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(340%); }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f7f7fa;
        --secondary: rgba(235, 235, 245, .68);
        --card: rgba(28, 28, 30, .94);
        --stroke: rgba(255, 255, 255, .11);
        --shadow: rgba(0, 0, 0, .42);
      }
      body { background: #000000; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <div class="ring"></div>
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H6.8A1.8 1.8 0 0 0 5 4.8v14.4A1.8 1.8 0 0 0 6.8 21h10.4a1.8 1.8 0 0 0 1.8-1.8V8z" />
          <path d="M14 3v5h5" />
          <path d="m9 16 6.7-6.7a1.4 1.4 0 0 1 2 2L11 18l-3 .7z" />
        </svg>
      </div>
    </div>
    <h1 id="status">正在准备签名</h1>
    <p id="detail">正在初始化安全签名环境，请稍候</p>
    <div class="progress" aria-hidden="true"></div>
  </main>

  <script src="./sap-signer.js"></script>
  <script>
    window.setSigningStatus = (message, detail) => {
      document.getElementById("status").textContent = message;
      if (detail) document.getElementById("detail").textContent = detail;
    };

    window.setSigningError = error => {
      document.body.classList.add("failed");
      document.getElementById("status").textContent = "签名失败";
      document.getElementById("detail").textContent = error;
    };

    // Native 端通过 web.notify({ event, message }) 触发这个入口。
    // 异步签名结果必须用 $notify 回传，不能作为 web.exec 的 Promise 返回值。
    let signing = false;
    const nativeNotify = (event, message) => {
      if (typeof $notify === "function") $notify(event, message);
    };

    window.sapStart = payload => {
      if (signing) return;
      signing = true;
      const request = payload || {};
      const requestId = String(request.requestId || "");
      const options = request.options || {};
      (async () => {
        try {
          setSigningStatus("正在准备签名", "正在加载 SAP 签名引擎，请稍候");
          await loadSapSigner(options);
          nativeNotify("sapReady", { requestId });
          setSigningStatus("正在生成签名", "正在与 Apple 安全服务通信");
          const signature = request.bodyBase64
            ? await sapSignBytes(String(request.bodyBase64), options)
            : await sapSign(String(request.xml || ""), options);
          if (!signature) throw new Error("SAP 签名引擎返回空结果");
          nativeNotify("sapSigned", { requestId, signature: String(signature) });
        } catch (error) {
          const message = error && error.message ? error.message : String(error || "未知错误");
          setSigningError(message);
          nativeNotify("sapFailed", { requestId, error: message });
        }
      })();
    };
  </script>
</body>
</html>
